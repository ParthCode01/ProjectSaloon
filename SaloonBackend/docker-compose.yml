services:
  mysql:
    image: mysql:8.0
    container_name: saloon-mysql
    environment:
      MYSQL_DATABASE: saloonmanagement
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - saloon-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: saloon-redis

  app:
    build: .
    container_name: saloon-app
    ports:
      - "8000:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/saloonmanagement
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  saloon-mysql-data: